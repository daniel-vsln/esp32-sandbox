; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` без -e збирає лише прошивку: src/ не компілюється під native
default_envs = freenove_esp32_s3_wroom

[env]
test_framework = unity

; Тести на комп'ютері: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
lib_deps = fabiobatsilva/ArduinoFake@^0.4.0 ; String, Serial, millis тощо для хоста
test_ignore = embedded/*

; Тести на платі: pio test -e freenove_esp32_s3_wroom
[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
test_ignore = native/*
extra_scripts = post:scripts/flatten_compiledb.py ; шляхи SDK для clangd

; --- Конфігурація шини пам'яті для N16R8 ---
board_build.flash_mode = qio        ; Вмикаємо швидкий режим Quad SPI для Flash
board_build.arduino.memory_type = qio_opi ; КРИТИЧНО: Quad Flash + Octal PSRAM

; --- Об'єм та розділи ---
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; --- Прапори компіляції для ініціалізації PSRAM ---
build_flags = 
    -D BOARD_HAS_PSRAM              ; Активує підтримку PSRAM в коді Arduino
    -D CORE_DEBUG_LEVEL=3
